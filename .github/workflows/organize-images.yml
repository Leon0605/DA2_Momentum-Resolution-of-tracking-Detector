name: Organize PNG Files

on:
  push:
    paths:
      - '**.png'
    branches:
      - main
  workflow_dispatch:

jobs:
  organize-images:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Configure git
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
      
      - name: Move PNG files to images folder
        run: |
          # Create images folder if it doesn't exist
          mkdir -p images
          
          # Find all PNG files in root directory (not in images folder)
          pngFiles=$(find . -maxdepth 1 -name "*.png" -type f)
          
          if [ -z "$pngFiles" ]; then
            echo "No PNG files found in root directory"
            exit 0
          fi
          
          # Move each PNG file to images folder
          for file in $pngFiles; do
            filename=$(basename "$file")
            echo "Moving $filename to images/"
            git mv "$file" "images/$filename"
          done
      
      - name: Check for changes
        id: check_changes
        run: |
          if git diff --cached --quiet; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
          fi
      
      - name: Commit and push changes
        if: steps.check_changes.outputs.has_changes == 'true'
        run: |
          git commit -m "chore: organize PNG files into images folder"
          git push origin main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
